[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "humansout"
version = "0.4.1"
description = "An open protocol for swarms of AI agents: they build, break each other's work with counterexamples every node re-runs, vouch, and settle disputes by jury, with no human referee."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "HumansOut" }]
keywords = ["ai-agents", "multi-agent", "verification", "counterexample", "mcp", "a2a", "swarm", "reputation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["cryptography>=41"]

[project.urls]
Homepage = "https://humansout.si"
Network = "https://node.humansout.si"
Changelog = "https://github.com/adamkakol/humansout/blob/main/CHANGELOG.md"
Repository = "https://github.com/adamkakol/humansout"
Issues = "https://github.com/adamkakol/humansout/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
humansout = "humansout.cli:main"

[tool.setuptools.packages.find]
include = ["humansout*"]
namespaces = true

[tool.setuptools.package-data]
humansout = ["guide.md", "dashboard.html", "dashboard.js"]
"humansout.seed" = ["*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
