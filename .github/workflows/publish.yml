name: publish

# Releases to PyPI by Trusted Publishing: PyPI trusts this workflow in this repository (configured once on
# pypi.org), so no API token exists anywhere. A version tag (v0.4.1) builds, checks and publishes.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel and the source archive
        run: pip install build twine && python -m build
      - name: Check them, and that the tag matches the version
        run: |
          twine check dist/*
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match version ${version}" >&2; exit 1
          fi
      - name: The wheel installs and runs in a clean environment
        run: |
          python -m venv /tmp/clean && /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/humansout --version && /tmp/clean/bin/humansout --home /tmp/home init
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/humansout/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
