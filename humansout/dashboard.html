<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HumansOut node</title>
<style>
/* Layout: an operator console. Mission list on the left, the selected mission's record on the right.
   Orange marks what needs a human; state is shown as chips so problems are visible at a glance. */
:root {
  color-scheme: light;
  --bg: #f4f4f1; --panel: #ffffff; --ink: #121212; --muted: #5d5d57; --line: #d9d9d2; --soft: #ececE6;
  --human: #e5531a; --human-bg: #fde7dc; --ok: #1f7a4d; --ok-bg: #dcf1e6; --bad: #b42318; --bad-bg: #fbe1de;
  --wait: #7a5b00; --wait-bg: #f7ecc4; --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #111110; --panel: #1b1b19; --ink: #ecece8; --muted: #a2a29b; --line: #34342f; --soft: #262623;
    --human: #ff7a45; --human-bg: #3a1f13; --ok: #5fd39a; --ok-bg: #12301f; --bad: #ff8a7a; --bad-bg: #3a1714;
    --wait: #e8c45a; --wait-bg: #33290d;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
header h1 { font-size: 15px; margin: 0; display: flex; align-items: center; gap: 8px; }
header h1::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--human); }
.meta { color: var(--muted); font-family: var(--mono); font-size: 12px; }
main { display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); min-height: calc(100vh - 50px); }
@media (max-width: 860px) { main { grid-template-columns: 1fr; } }
aside { border-right: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
@media (max-width: 860px) { aside { border-right: 0; border-bottom: 1px solid var(--line); } }
section.detail { padding: 16px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
h2 { font-size: 18px; margin: 0; text-wrap: balance; }
h3 { font-size: 12px; margin: 0 0 8px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; min-width: 0; }
button.mission { all: unset; display: block; cursor: pointer; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
button.mission:hover { border-color: var(--muted); }
button.mission[aria-current="true"] { border-color: var(--ink); box-shadow: inset 3px 0 0 var(--ink); }
button.mission:focus-visible, a:focus-visible, button:focus-visible { outline: 2px solid var(--human); outline-offset: 2px; }
.goal { font-weight: 600; margin: 4px 0; overflow-wrap: anywhere; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { font: 600 11px/1 var(--mono); padding: 4px 6px; border-radius: 4px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.wait { background: var(--wait-bg); color: var(--wait); }
.chip.human { background: var(--human-bg); color: var(--human); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; margin: 0; }
dt { color: var(--muted); }
dd { margin: 0; overflow-wrap: anywhere; }
code, .mono { font-family: var(--mono); font-size: 12px; }
.claim { border: 1px solid var(--line); border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.objection { margin-left: 16px; border-left: 3px solid var(--line); padding: 6px 0 6px 10px; display: flex; flex-direction: column; gap: 6px; }
.objection.reproduced { border-left-color: var(--bad); }
.objection.human { border-left-color: var(--human); }
.evidence { white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink); max-height: 9em; overflow: auto; background: var(--soft); border-radius: 4px; padding: 6px 8px; font-size: 13px; }
a.file { color: inherit; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; font-family: var(--mono); font-size: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12px; }
td.num { font-variant-numeric: tabular-nums; text-align: right; }
.timeline { display: flex; flex-direction: column; }
.event { display: grid; grid-template-columns: 76px 128px 96px minmax(0, 1fr); gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
@media (max-width: 640px) { .event { grid-template-columns: 1fr; gap: 2px; } }
.event .what { overflow-wrap: anywhere; }
.empty { color: var(--muted); padding: 24px 0; }
.scroll { overflow-x: auto; }
dialog { width: min(900px, 94vw); max-height: 86vh; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); padding: 0; }
dialog::backdrop { background: rgba(0, 0, 0, .45); }
dialog header { position: static; }
#viewer-body.wrap { white-space: pre-wrap; overflow-wrap: anywhere; }
dialog pre { margin: 0; padding: 12px 16px; overflow: auto; max-height: 70vh; font: 12px/1.5 var(--mono); white-space: pre; }
.close { margin-left: auto; font: inherit; padding: 4px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--soft); color: var(--ink); cursor: pointer; }
.alert { border-color: var(--human); background: var(--human-bg); }
</style>
</head>
<body>
<header>
  <h1>HumansOut node</h1>
  <span class="meta" id="node">loading…</span>
  <span class="meta" id="watch"></span>
  <span class="meta" id="sync"></span>
  <span class="meta" id="refreshed"></span>
</header>
<main>
  <aside aria-label="Missions">
    <h3>Missions</h3>
    <div id="missions" class="row" style="flex-direction: column; align-items: stretch"></div>
    <div id="turns-box" hidden>
      <h3>Your agents' turns</h3>
      <div id="turns" class="row" style="flex-direction: column; align-items: stretch"></div>
    </div>
  </aside>
  <section class="detail" id="detail" aria-live="polite">
    <p class="empty">Choose a mission to see its record.</p>
  </section>
</main>
<dialog id="viewer" aria-label="File content">
  <header><strong id="viewer-title" class="mono"></strong><button class="close" id="viewer-close">Close</button></header>
  <pre id="viewer-body"></pre>
</dialog>
<script src="dashboard.js"></script>
</body>
</html>
